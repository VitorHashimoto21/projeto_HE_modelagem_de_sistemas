# CI (SPEC-001, CA-12): roda em todo Pull Request para DEVELOP ou main.
# Com a proteção de branch ligada, o merge fica bloqueado enquanto falhar.
name: CI

on:
  pull_request:
    branches: [DEVELOP, main]
  push:
    branches: [DEVELOP, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, schema, testes e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: he_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Bancos locais do serviço PostgreSQL do Actions — nunca os do Supabase.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/he_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/he_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (gera o Prisma Client no postinstall)
        run: npm ci

      - name: Nenhum .env versionado (INV-008)
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::Arquivo .env versionado. Remova-o do Git."; exit 1
          fi

      - name: Lint (inclui fronteiras entre camadas — T13)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Aplicar migrações e checar divergência com o schema (INV-010)
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Testes unitários
        run: npm test

      - name: Testes de integração (PostgreSQL de serviço)
        run: npm run test:integracao

      - name: Build
        run: npm run build
