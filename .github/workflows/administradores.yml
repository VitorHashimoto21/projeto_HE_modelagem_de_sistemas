# Papel de Administrador da plataforma (SPEC-018, 5.1): workflow manual que roda o script
# scripts/admin.ts no banco do ambiente escolhido, com o segredo DIRECT_URL do ambiente (o mesmo
# das migrações). A credencial do banco não sai do GitHub, e o responsável registrado no banco é
# o usuário do GitHub que disparou a execução. Em desenvolvimento, rode o script localmente.
# SPEC-019 (5.11): o e-mail da conta nunca aparece no log (o repositório é público). Ele é lido do evento,
# mascarado e só então passado aos passos seguintes, que mostram "***" no lugar dele.
name: Administradores

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Ação"
        type: choice
        options: [conceder, retirar, redefinir-2fator]
        required: true
      email:
        description: "E-mail da conta (exclusiva para o suporte, já cadastrada)"
        type: string
        required: true
      ambiente:
        description: "Ambiente"
        type: choice
        options: [homologacao, producao]
        default: homologacao
        required: true

concurrency:
  group: administradores-${{ inputs.ambiente }}
  cancel-in-progress: false

jobs:
  administrar:
    name: ${{ inputs.acao }} — ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # SPEC-019 (OPEN-002): só para redefinir-2fator; a chave secreta fica no ambiente e chega ao
      # script por variável, nunca no comando.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ADMIN_RESPONSAVEL: ${{ github.actor }} (GitHub Actions)
      ACAO: ${{ inputs.acao }}
    steps:
      - name: Mascarar o e-mail no log
        run: |
          EMAIL=$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$EMAIL" ]; then echo "::add-mask::$EMAIL"; fi
          echo "EMAIL=$EMAIL" >> "$GITHUB_ENV"

      - name: Verificar se o ambiente está configurado
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error title=Administradores::Segredo DIRECT_URL não definido para o ambiente ${{ inputs.ambiente }}."
            exit 1
          fi
          if [ "$ACAO" = "redefinir-2fator" ] && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; }; then
            echo "::error title=Administradores::Segredos SUPABASE_URL e SUPABASE_SECRET_KEY não definidos para o ambiente ${{ inputs.ambiente }}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar o script
        run: npx tsx scripts/admin.ts "$ACAO" "$EMAIL"
